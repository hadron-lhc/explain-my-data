[project]
name = "explain-my-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "tachyon-lhc", email = "valentingonzalezdaumes@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.5.3",
  "pandas>=3.0.5",
  "plotly>=7.0.0",
  "scikit-learn>=1.9.1",
  "scipy>=1.18.1",
  "streamlit>=1.63.0",
]

[project.scripts]
explain-my-data = "explain_my_data:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.7"]

[tool.uv]
package = false
